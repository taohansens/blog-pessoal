services:
  blog-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog-api
    ports:
      - "127.0.0.1:9899:9899"
    environment:
      - COUCHDB_URI=${COUCHDB_URI:-http://couchdb:5984}
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-admin}
      - COUCHDB_DB_NAME=${COUCHDB_DB_NAME:-blog}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_OAUTH_REDIRECT_FRONTEND=${GITHUB_OAUTH_REDIRECT_FRONTEND:http://localhost:3000}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - JAVA_OPTS=${JAVA_OPTS:--Xmx512m -Xms256m}
    depends_on:
      - couchdb
    restart: unless-stopped
    networks:
      - blog-network

  couchdb:
    image: couchdb:latest
    container_name: blog-couchdb
    environment:
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-admin}
    volumes:
      - couchdb-data:/opt/couchdb/data
    restart: unless-stopped
    networks:
      - blog-network

volumes:
  couchdb-data:
    driver: local

networks:
  blog-network:
    driver: bridge

