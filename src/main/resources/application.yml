server:
  port: 9899

spring:
  web:
    resources:
      # Desativa completamente recursos estáticos - API puramente REST
      add-mappings: false
      static-locations: classpath:/none/
  jackson:
    default-property-inclusion: non_null
    # Configurações de serialização/deserialização são feitas no JacksonConfig
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - user:email
              - read:user
        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: login

couchdb:
  uri: ${COUCHDB_URI:http://localhost:5984}
  username: ${COUCHDB_USER:admin}
  password: ${COUCHDB_PASSWORD:admin}
  database: ${COUCHDB_DB_NAME:blog}
  timeout: ${COUCHDB_TIMEOUT:30}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

cors:
  # Informe origens com esquema/porta (ex.: http://localhost:3000)
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Configuração do administrador
app:
  frontend:
    url: ${GITHUB_OAUTH_REDIRECT_FRONTEND:http://localhost:3000}
  admin:
    email: ${ADMIN_EMAIL:taohansens}

logging:
  level:
    br.com.taohansen.blog: DEBUG
    org.springframework.web.reactive: DEBUG
    org.springframework.security: DEBUG